name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  checks: write

jobs:
  php-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: titanium_rental_car
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, json, fileinfo, gd, curl, sodium
          ini-values: allow_url_fopen=On
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit
        run: composer audit || true

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              break
            fi
            sleep 2
          done

      - name: Prepare database schema
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: titanium_rental_car
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot < database/schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot < database/seed.sql

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: titanium_rental_car
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php bin/migrate.php

      - name: Prepare .env for smoke tests
        run: |
          cp .env.example .env
          sed -i 's/\r$//' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8889|' .env
          grep -q '^DB_PASSWORD=root$' .env

      - name: Start PHP server for smoke tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: titanium_rental_car
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_URL: http://127.0.0.1:8889
        run: |
          php -S 127.0.0.1:8889 -t public public/router.php > /dev/null 2>&1 &
          sleep 2
          curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:8889/login | grep -q 200

      - name: Verify seed password
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: titanium_rental_car
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php -r '
          require "bin/bootstrap-cli.php";
          $u = User::findByEmail("owner@titaniumrental.com");
          if ($u === null || !password_verify("password123", (string) $u["password_hash"])) {
            fwrite(STDERR, "invalid demo password hash\n");
            exit(1);
          }
          echo "seed password ok\n";
          '

      - name: Verify public HTTP routes
        run: |
          curl -sf -o /dev/null -w "login:%{http_code}\n" http://127.0.0.1:8889/login | grep -q "login:200"
          curl -sf -o /dev/null -w "home:%{http_code}\n" http://127.0.0.1:8889/ | grep -q "home:200"

      - name: Run PHPUnit
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8889
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: titanium_rental_car
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit --log-junit phpunit-results.xml --display-errors --display-deprecations

      - name: Publish PHPUnit report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: PHPUnit
          path: phpunit-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Syntax check (app)
        run: find app bin public/index.php config -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify backup script (dry)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: titanium_rental_car
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php bin/verify-backup.php --help 2>/dev/null || php -l bin/verify-backup.php
