services:
  app:
    build: .
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8888
      DB_HOST: db
      DB_DATABASE: titanium_rental_car
      DB_USERNAME: titanium
      DB_PASSWORD: titanium
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: titanium_rental_car
      MYSQL_USER: titanium
      MYSQL_PASSWORD: titanium
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
